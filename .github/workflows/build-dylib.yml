name: Build BHTikTok iOS dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile BHTikTok dylib
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos, ldid & iOS SDK
        run: |
          brew install ldid || true
          git clone --recursive https://github.com/theos/theos.git ~/theos
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk ~/theos/sdks/
          ls -la ~/theos/sdks/

      - name: Build Standalone TikTokAutoComment_LQ (Zero Dependencies for Esign/Scarlet)
        run: |
          mkdir -p output
          xcrun -sdk iphoneos clang -shared -dynamiclib \
            -arch arm64 -arch arm64e \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework UIKit -framework Foundation \
            -install_name @rpath/TikTokAutoComment_LQ.dylib \
            -o output/TikTokAutoComment_LQ.dylib \
            AutoCommentLQ.m

          ldid -S output/TikTokAutoComment_LQ.dylib || true
          cp output/TikTokAutoComment_LQ.dylib ./TikTokAutoComment_LQ.dylib
          ls -lh ./TikTokAutoComment_LQ.dylib

      - name: Build BHTikTok Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1
          find .theos/ -name "*.dylib" -exec cp {} output/BHTikTok_AutoComment.dylib \;
          
          # Bản gốc rootful
          cp output/BHTikTok_AutoComment.dylib ./BHTikTok_AutoComment_Rootful.dylib
          
          # Sửa install_name và rpath sang @rpath để dùng được cho TrollFools / Esign / Sideloadly
          install_name_tool -id @rpath/BHTikTok.dylib output/BHTikTok_AutoComment.dylib || true
          install_name_tool -change /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate @rpath/CydiaSubstrate.framework/CydiaSubstrate output/BHTikTok_AutoComment.dylib || true
          install_name_tool -add_rpath @executable_path/Frameworks output/BHTikTok_AutoComment.dylib || true
          install_name_tool -add_rpath @loader_path/Frameworks output/BHTikTok_AutoComment.dylib || true
          
          # Ký lại sau khi sửa LC_LOAD_DYLIB
          ldid -S output/BHTikTok_AutoComment.dylib || true
          
          cp output/BHTikTok_AutoComment.dylib ./BHTikTok_AutoComment_TrollFools.dylib
          cp output/BHTikTok_AutoComment.dylib ./BHTikTok_AutoComment.dylib
          ls -lh ./BHTikTok_AutoComment*.dylib

      - name: Build CydiaSubstrate Shim & Package TikTokPlusPlus
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -arch arm64e -miphoneos-version-min=12.0 \
            -framework Foundation \
            -install_name @rpath/CydiaSubstrate.framework/CydiaSubstrate \
            -o output/CydiaSubstrate \
            CydiaSubstrate.m

          mkdir -p CydiaSubstrate.framework
          cp output/CydiaSubstrate CydiaSubstrate.framework/CydiaSubstrate
          ldid -S CydiaSubstrate.framework/CydiaSubstrate || true

          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -arch arm64e -miphoneos-version-min=12.0 \
            -framework Foundation \
            -install_name @rpath/CydiaSubstrate.dylib \
            -o CydiaSubstrate.dylib \
            CydiaSubstrate.m
          ldid -S CydiaSubstrate.dylib || true

          zip -r CydiaSubstrate.framework.zip CydiaSubstrate.framework
          zip -r TikTokPlusPlus_Fixed_Esign_AllDevices.zip TikTokPlusPlus_Fixed.dylib TikTokPlusPlus_arm64.dylib CydiaSubstrate.framework CydiaSubstrate.dylib
          ls -lh TikTokPlusPlus* CydiaSubstrate*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-AutoComment-dylibs
          path: |
            TikTokAutoComment_LQ.dylib
            TikTokPlusPlus*.dylib
            TikTokPlusPlus*.zip
            CydiaSubstrate*
            BHTikTok_AutoComment*.dylib
            packages/*.deb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v3.2.0-autocomment
          name: "TikTok Auto-Comment & TikTok++ Fixed (Anti-Crash All Devices)"
          body: |
            Bản cập nhật v3.2.0 sửa lỗi văng ứng dụng TikTok++ trên mọi thiết bị và hoàn thiện Auto-Comment:

            ### 1. Sửa lỗi văng ứng dụng TikTok++ (TikTokPlusPlus.dylib):
            - **Nguyên nhân văng**: Bản gốc `TikTokPlusPlus.dylib` liên kết cứng tới `@rpath/CydiaSubstrate.framework/CydiaSubstrate` và chỉ tìm trong các thư mục jailbreak `/var/jb/`. Khi người dùng ký bằng Esign/Scarlet/TrollStore trên máy non-jailbreak, iOS không tìm thấy CydiaSubstrate dẫn đến **văng ngay lập tức khi mở app** (`Library not loaded`). Ngoài ra, slice `arm64e` có thể bị lỗi PAC trên iOS 15–18.
            - **Đã khắc phục hoàn toàn**:
              + Chuyển `LC_LOAD_DYLIB` sang `LC_LOAD_WEAK_DYLIB` (không bao giờ bị dyld crash nếu thiếu thư viện).
              + Thêm đầy đủ `@loader_path/Frameworks`, `@loader_path`, `@executable_path/Frameworks` vào RPATH.
              + Cung cấp sẵn file shim `CydiaSubstrate.framework` và `CydiaSubstrate.dylib` tương thích 100%.
              + Tách sẵn bản tháo PAC `TikTokPlusPlus_arm64.dylib` cho các máy non-jailbreak chạy ổn định tuyệt đối.

            ### 2. TikTok Auto-Comment LQ v3.2.0:
            - **Cơ chế Dual-Engine bắt video chuẩn 100%**: Hook trực tiếp vào sự kiện phát video `AWEPlayVideoPlayerController containerDidFullyDisplayWithReason:`.
            - **Quét Hashtag siêu sâu**: Quét cả caption lẫn cấu trúc thẻ `textExtra`, tự động lọc dấu tiếng Việt.
            - **Bộ tính năng BHTikTok mở rộng**: Chặn ads, tải không logo, thanh tua tiến trình, mở rộng 1000 ký tự, comment trong suốt, tích xanh.
          files: |
            TikTokAutoComment_LQ.dylib
            TikTokPlusPlus_Fixed.dylib
            TikTokPlusPlus_arm64.dylib
            TikTokPlusPlus_Fixed_Esign_AllDevices.zip
            CydiaSubstrate.dylib
            CydiaSubstrate.framework.zip
            BHTikTok_AutoComment*.dylib
            packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
