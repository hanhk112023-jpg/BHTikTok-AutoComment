name: Build BHTikTok iOS dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile BHTikTok dylib
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk ~/theos/sdks/
          ls -la ~/theos/sdks/

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1
          mkdir -p output
          find .theos/ -name "*.dylib" -exec cp {} output/BHTikTok_AutoComment.dylib \;
          cp output/BHTikTok_AutoComment.dylib ./BHTikTok_AutoComment.dylib || true
          ls -lh ./BHTikTok_AutoComment.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BHTikTok-AutoComment-dylib
          path: |
            BHTikTok_AutoComment.dylib
            packages/*.deb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-autocomment
          name: "BHTikTok Auto-Comment v1.0.0"
          body: |
            BHTikTok++ iOS Tweak kèm tính năng Auto-Comment Liên Quân Mobile (#lienquan, #aov, #lienquanmobile)
            Nội dung comment: `Nhập mã để được nhận 38 vé nhảy: avsqjyM3n7`
          files: |
            BHTikTok_AutoComment.dylib
            packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
