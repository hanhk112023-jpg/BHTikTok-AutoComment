name: Build BHTikTok iOS dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile BHTikTok dylib
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos, ldid & iOS SDK
        run: |
          brew install ldid || true
          git clone --recursive https://github.com/theos/theos.git ~/theos
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk ~/theos/sdks/
          ls -la ~/theos/sdks/

      - name: Build Standalone TikTokAutoComment_LQ & TikTokPlusPlus_AllInOne
        run: |
          mkdir -p output
          xcrun -sdk iphoneos clang -shared -dynamiclib \
            -arch arm64 -arch arm64e \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework UIKit -framework Foundation -framework Photos -framework CoreGraphics \
            -lz \
            -install_name @rpath/TikTokAutoComment_LQ.dylib \
            -o output/TikTokAutoComment_LQ.dylib \
            AutoCommentLQ.m

          ldid -S output/TikTokAutoComment_LQ.dylib || true
          cp output/TikTokAutoComment_LQ.dylib ./TikTokAutoComment_LQ.dylib
          ls -lh ./TikTokAutoComment_LQ.dylib

          # Build TikTokPlusPlus_AllInOne.dylib (Tích hợp 100% TikTok++ v4 và Auto-Comment vào duy nhất 1 dylib)
          xcrun -sdk iphoneos clang -shared -dynamiclib \
            -arch arm64 \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework UIKit -framework Foundation -framework Photos -framework CoreGraphics \
            -lz \
            -install_name @rpath/TikTokPlusPlus.dylib \
            -o output/TikTokPlusPlus_AllInOne.dylib \
            AutoCommentLQ.m

          ldid -S output/TikTokPlusPlus_AllInOne.dylib || true
          cp output/TikTokPlusPlus_AllInOne.dylib ./TikTokPlusPlus_AllInOne.dylib
          ls -lh ./TikTokPlusPlus_AllInOne.dylib

      - name: Build BHTikTok Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1
          find .theos/ -name "*.dylib" -exec cp {} output/BHTikTok_AutoComment.dylib \;
          
          # Bản gốc rootful
          cp output/BHTikTok_AutoComment.dylib ./BHTikTok_AutoComment_Rootful.dylib
          
          # Sửa install_name và rpath sang @rpath để dùng được cho TrollFools / Esign / Sideloadly
          install_name_tool -id @rpath/BHTikTok.dylib output/BHTikTok_AutoComment.dylib || true
          install_name_tool -change /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate @rpath/CydiaSubstrate.framework/CydiaSubstrate output/BHTikTok_AutoComment.dylib || true
          install_name_tool -add_rpath @executable_path/Frameworks output/BHTikTok_AutoComment.dylib || true
          install_name_tool -add_rpath @loader_path/Frameworks output/BHTikTok_AutoComment.dylib || true
          
          # Ký lại sau khi sửa LC_LOAD_DYLIB
          ldid -S output/BHTikTok_AutoComment.dylib || true
          
          cp output/BHTikTok_AutoComment.dylib ./BHTikTok_AutoComment_TrollFools.dylib
          cp output/BHTikTok_AutoComment.dylib ./BHTikTok_AutoComment.dylib
          ls -lh ./BHTikTok_AutoComment*.dylib

      - name: Build CydiaSubstrate Shim & Package TikTokPlusPlus
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -arch arm64e -miphoneos-version-min=12.0 \
            -framework Foundation \
            -install_name @rpath/CydiaSubstrate.framework/CydiaSubstrate \
            -o output/CydiaSubstrate \
            shim/CydiaSubstrate.m

          mkdir -p CydiaSubstrate.framework
          cp output/CydiaSubstrate CydiaSubstrate.framework/CydiaSubstrate
          ldid -S CydiaSubstrate.framework/CydiaSubstrate || true

          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -arch arm64e -miphoneos-version-min=12.0 \
            -framework Foundation \
            -install_name @rpath/CydiaSubstrate.dylib \
            -o CydiaSubstrate.dylib \
            shim/CydiaSubstrate.m
          ldid -S CydiaSubstrate.dylib || true

          zip -r CydiaSubstrate.framework.zip CydiaSubstrate.framework
          zip -r TikTokPlusPlus_Fixed_Esign_AllDevices.zip TikTokPlusPlus_Fixed.dylib TikTokPlusPlus_arm64.dylib CydiaSubstrate.framework CydiaSubstrate.dylib
          ls -lh TikTokPlusPlus* CydiaSubstrate*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-AutoComment-dylibs
          path: |
            TikTokAutoComment_LQ.dylib
            TikTokPlusPlus*.dylib
            TikTokPlusPlus*.zip
            CydiaSubstrate*
            BHTikTok_AutoComment*.dylib
            packages/*.deb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v3.4.0-ultimate-tiktok
          name: "TikTok Ultimate All-in-One v3.4.0 (Anti-Bot, HD Download, Inset UI, Anti-Crash)"
          body: |
            Bản nâng cấp **TikTok Ultimate All-in-One v3.4.0** được tối ưu hóa toàn diện bởi đội ngũ multi-agent:

            ### 🛡️ 1. Kiến Trúc Hook Siêu Bền Vững & Chống Văng (PAC & ARM64e)
            - **Superclass Pollution Protection**: Tách biệt hoàn toàn `class_copyMethodList` và `class_addMethod`, không ghi đè vào `Method` của lớp cha, triệt tiêu 100% xung đột selector và lỗi `unrecognized selector`.
            - **Loại bỏ Crash Ad-Block**: Chuyển đổi cơ chế `initWithDictionary:error:` từ trả về `nil` sang tẩy uế thuộc tính quảng cáo (`isAds = NO`, `adInfo = nil`), dứt điểm lỗi văng mảng `insertNilObjectException`.
            - **Loại bỏ KVC nhạy cảm**: Không còn truy xuất `_targets` trên `UIGestureRecognizer`, tương thích chuẩn từ iOS 15 đến iOS 18.

            ### 🤖 2. Bộ Chống Khóa & Lách Thuật Toán Bot TikTok (Anti-Bot Engine)
            - **Spintax Engine**: Hỗ trợ cú pháp xoay vòng nội dung `{A|B|C}` (ví dụ: `{Nhập mã|Code nhận vé}: {avsqjyM3n7} {🔥|✨}`). Mỗi bình luận đăng ra có cấu trúc văn bản hoàn toàn độc nhất.
            - **Invisible Entropy Hashing**: Chèn ngẫu nhiên các ký tự Unicode vô hình (`\u200B`, `\u200C`, `\u2060`) làm thay đổi mã băm (MD5/SimHash) văn bản đối với hệ thống Dolphin NLP của TikTok mà mắt thường không thấy được.
            - **Human Typing Cadence**: Gõ từng ký tự qua `insertText:` với độ trễ ngẫu nhiên 45ms–95ms và ngừng nghỉ 150ms–200ms ở dấu cách/dấu câu giống hệt người thật gõ bàn phím.
            - **Organic Watch Ratio Heuristic**: Chỉ gửi bình luận khi đã xem tối thiểu 25%–40% thời lượng video (hoặc > 3 giây). Nếu người dùng lướt qua sớm, tiến trình tự hủy an toàn.
            - **Tốc độ & Giới hạn Rate-Limit**: Khống chế tối đa 25 comment/giờ và giãn cách tối thiểu 18s để không bao giờ dính lỗi tốc độ (3002047).

            ### 🎬 3. Động Cơ Tải Media HD Không Logo & Chặn Quảng Cáo Triệt Để
            - **Tải Video Gốc Không Watermark**: Bóc tách trực tiếp luồng phát chất lượng cao nhất (1080p H.264/ByteVC1) từ `play_addr` và `bitRateModels`, loại bỏ logo bay và end-card 3s.
            - **Tải Album Ảnh & Âm Thanh Gốc**: Hỗ trợ tải trọn bộ ảnh gốc của video trượt ảnh (photo album) và file MP3 nhạc nền.
            - **Lưu trực tiếp vào Thư Viện Ảnh (Photos Album)**: Kèm hiển thị tiến trình tải trực quan.
            - **Chặn Sạch Mọi Loại Ads & Banner**: Lọc sạch video quảng cáo, livestream ads, thẻ gợi ý follow, và giỏ hàng vàng thương mại.

            ### 🎨 4. Giao Diện Cài Đặt Apple Native Inset Grouped Chuẩn Mực
            - **Kích hoạt bằng cử chỉ kín đáo**: Chạm 2 lần (Double-Tap) hoặc Nhấn giữ (Long-Press $\ge 0.5s$) vào chữ **"Trang chủ"** ở góc dưới bên trái màn hình. Màn hình sạch bóng không nút nổi vướng víu.
            - **Giao diện Inset Grouped Dark Mode**: Thiết kế đồng bộ hoàn toàn với Apple Settings, có icon badge thẩm mỹ.
            - **Trình Quản Lý Mẫu Bình Luận (Comment Templates)**: Hỗ trợ thêm/sửa/xóa nhiều mẫu và bật chế độ **Bốc ngẫu nhiên (Random Rotation)**.
            - **Trình Quản Lý Bộ Lọc Hashtag**: Quét cả caption và mảng thẻ gốc `textExtra`.
            - **Công Cụ Dọn Cache An Toàn**: Tính toán dung lượng cache thực tế và dọn dẹp sạch sẽ mà không bao giờ mất phiên đăng nhập.
            - **Tự động cuộn / Lặp lại video (Auto Play/Loop)**.
          files: |
            TikTokPlusPlus_AllInOne.dylib
            TikTokAutoComment_LQ.dylib
            TikTokPlusPlus_Fixed.dylib
            TikTokPlusPlus_arm64.dylib
            TikTokPlusPlus_Fixed_Esign_AllDevices.zip
            CydiaSubstrate.dylib
            CydiaSubstrate.framework.zip
            BHTikTok_AutoComment*.dylib
            packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
